name: Dòng Tiền PRO Bot — Master Edition

on:
  schedule:
    # 4 ca trực 6 tiếng/ngày — Chạy liên tục 24/7/365 (Thứ 2 đến Chủ Nhật & Lễ, ngày đêm):
    # Ca 1 (Sáng): 07:00 VN (00:00 UTC) — Bao trọn phiên sáng 09:00 - 11:30
    - cron: '0 0 * * *'
    # Ca 2 (Chiều): 13:00 VN (06:00 UTC) — Bao trọn phiên chiều 13:00 - 15:00
    - cron: '0 6 * * *'
    # Ca 3 (Tối): 19:00 VN (12:00 UTC) — Phục vụ NĐT tra cứu mã buổi tối
    - cron: '0 12 * * *'
    # Ca 4 (Đêm & Rạng sáng): 01:00 VN (18:00 UTC) — Trực ca đêm tới sáng
    - cron: '0 18 * * *'

  workflow_dispatch:   # Cho phép kích hoạt trực tiếp bằng tay bất cứ lúc nào
    inputs:
      duration_minutes:
        description: 'Thời gian chạy liên tục (phút, tối đa 355)'
        required: false
        default: '355'

concurrency:
  group: dtpro-bot-live
  cancel-in-progress: true

jobs:
  dtpro-live-session:
    name: "DTPro — Live Daemon Session"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DTPro Live Bot Session
        env:
          TZ: 'Asia/Ho_Chi_Minh'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python dtpro_runner.py --listen --max-minutes ${{ inputs.duration_minutes || '355' }}

