name: Dòng Tiền PRO Bot — Master Edition

on:
  schedule:
    # Phiên sáng VN 09:00–11:30 = UTC 02:00–04:30 (Thứ 2–6)
    - cron: '*/5 2-3 * * 1-5'
    - cron: '0,5,10,15,20,25,30 4 * * 1-5'
    # Phiên chiều VN 13:00–15:00 = UTC 06:00–08:00
    - cron: '*/5 6-7 * * 1-5'
    - cron: '0 8 * * 1-5'

  workflow_dispatch:   # Chạy thủ công bất cứ lúc nào

jobs:
  dtpro-scan-and-reply:
    name: "DTPro — Quét & Trả lời Telegram"
    runs-on: ubuntu-latest
    timeout-minutes: 10   # NW kernel cần ~60-90s để quét 700 mã

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DTPro Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python dtpro_runner.py
