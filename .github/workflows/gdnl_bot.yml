name: GDNL Bot — Vùng Xu Hướng PRO

on:
  schedule:
    # Phiên sáng: 09:00–11:30 VN (UTC+7) = 02:00–04:30 UTC → Thứ 2 đến Thứ 6
    - cron: '*/5 2-3 * * 1-5'
    - cron: '0,5,10,15,20,25,30 4 * * 1-5'
    # Phiên chiều: 13:00–15:00 VN = 06:00–08:00 UTC
    - cron: '*/5 6-7 * * 1-5'
    - cron: '0 8 * * 1-5'

  workflow_dispatch:   # Cho phép chạy thủ công bất cứ lúc nào

jobs:
  gdnl-scan-and-reply:
    name: "Quét GDNL & Trả lời Telegram"
    runs-on: ubuntu-latest
    timeout-minutes: 8   # Giới hạn 8 phút để không vượt free tier

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GDNL Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gdnl_runner.py
