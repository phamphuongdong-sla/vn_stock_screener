name: GDNL Bot — Vùng Xu Hướng PRO

on:
  workflow_dispatch:   # Chỉ chạy thủ công khi cần

jobs:
  gdnl-scan-and-reply:
    name: "Quét GDNL & Trả lời Telegram"
    runs-on: ubuntu-latest
    timeout-minutes: 8   # Giới hạn 8 phút để không vượt free tier

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run GDNL Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gdnl_runner.py
