name: Vietnam Stock Screener Telegram Bot

on:
  schedule:
    # Giờ Việt Nam (UTC+7): Thứ 2 đến Thứ 6
    - cron: '30 2 * * 1-5'   # 09:30 VN
    - cron: '30 3 * * 1-5'   # 10:30 VN
    - cron: '30 4 * * 1-5'   # 11:30 VN (Kết thúc phiên sáng)
    - cron: '30 6 * * 1-5'   # 13:30 VN
    - cron: '30 7 * * 1-5'   # 14:30 VN (Phiên ATC chốt ngày)
  workflow_dispatch:          # Cho phép bấm nút "Run workflow" để quét bất cứ lúc nào từ điện thoại

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v3

      - name: Cài đặt Python
        uses: setup-python@v4
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện
        run: |
          pip install -r requirements.txt

      - name: Quét thị trường & Bắn tin nhắn Telegram
        run: |
          python test_leading_stocks.py
