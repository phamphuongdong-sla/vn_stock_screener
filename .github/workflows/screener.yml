name: Vietnam Stock Screener Telegram Bot

on:
  schedule:
    # Lịch quét giờ Việt Nam (UTC+7): Thứ 2 đến Thứ 6
    - cron: '30 2 * * 1-5'   # 09:30 VN
    - cron: '30 3 * * 1-5'   # 10:30 VN
    - cron: '30 4 * * 1-5'   # 11:30 VN (Hết phiên sáng)
    - cron: '30 6 * * 1-5'   # 13:30 VN
    - cron: '30 7 * * 1-5'   # 14:30 VN (Phiên ATC)
  workflow_dispatch:          # Cho phép bấm nút quét từ điện thoại bất cứ lúc nào

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python test_leading_stocks.py
