name: Vietnam Stock Screener Telegram Bot

on:
  workflow_dispatch:          # Chỉ chạy thủ công khi cần

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python test_leading_stocks.py
